# Serves the React build and forwards /api to FastAPI (the browser only ever sees one origin).
server {
    listen 80;
    server_name _;
    server_tokens off;                  # don't advertise the nginx version
    root /usr/share/nginx/html;
    client_max_body_size 4m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # Build files have a content hash in their name -> safe to cache "forever".
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;   # add_header here would drop the server ones
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Single-page app: unknown paths (/leads/123) load index.html, React Router handles them.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
